name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

  # Le corpus vit dans un AUTRE dépôt : le site doit se rafraîchir quand les DONNÉES
  # changent, pas seulement quand le générateur change.
  #
  # On tire au lieu d'être poussé, et c'est délibéré : un `repository_dispatch` venant du
  # dépôt de données exige un token inter-dépôts (le GITHUB_TOKEN d'une Action ne peut pas
  # déclencher un workflow ailleurs), donc un secret à créer, à porter au bon périmètre et à
  # renouveler à chaque expiration. Un horaire propre n'a besoin de rien : le GITHUB_TOKEN
  # de CE dépôt suffit à déployer ses propres Pages.
  #
  # 05:45 UTC, après le scraping de 05:12 dans optcgsim-deckpacks-data. Le corpus est
  # récupéré à chaque exécution, donc un scraping manqué ne décale rien.
  schedule:
    - cron: "45 5 * * *"

  # Conservé pour qui voudrait un redéploiement immédiat après un scraping, mais ce n'est
  # plus le chemin nominal — et il demande un token, contrairement à l'horaire ci-dessus.
  repository_dispatch:
    types: [corpus-mis-a-jour]

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, et on ne coupe pas celui en cours : un déploiement
# interrompu laisse le site dans un état indéterminé.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_URL: https://hquezser.github.io/optcgsim-deckpacks-library

jobs:
  construire:
    name: Vérifier sur le corpus réel, puis construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: optcgsim-deckpacks-library

      # Les liens inter-projets sont des chemins relatifs entre voisins : on reconstitue la
      # fraternité des dossiers, sinon verify.sh ne trouve ni le validateur de la spec, ni
      # le studio, ni le corpus.
      - uses: actions/checkout@v4
        with:
          repository: hquezser/optcgsim-deckpacks
          path: optcgsim-deckpacks

      - uses: actions/checkout@v4
        with:
          repository: hquezser/optcgsim-studio
          path: optcgsim-studio

      - uses: actions/checkout@v4
        with:
          repository: hquezser/optcgsim-deckpacks-data
          path: optcgsim-deckpacks-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: optcgsim-deckpacks-library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # LE garde-fou de la publication. Contrairement à la CI ordinaire — qui tourne sur les
      # fixtures et vérifie le générateur — celui-ci tourne sur le corpus réel et vérifie la
      # DONNÉE : chaque pack publié doit être réellement importable par le simulateur.
      # Publier un deck qui n'importe pas casserait la seule promesse du site.
      #
      # Pas d'étape de construction séparée après celui-ci : verify.sh construit déjà
      # `dist/` avec ce BASE_URL, et le publier tel quel garantit qu'on déploie EXACTEMENT
      # ce qui a été vérifié. Reconstruire serait redondant et pourrait diverger.
      - name: verify.sh sur le corpus réel (construit dist/)
        working-directory: optcgsim-deckpacks-library
        env:
          PY: python
          BASE_URL: ${{ env.BASE_URL }}
        # `pipefail` n'est PAS actif par défaut dans un `run:` (GitHub lance `bash -e`).
        # Sans lui, `verify.sh | tee` renvoie le code de sortie de `tee`, toujours 0 : un
        # portillon rouge passerait pour vert et on déploierait un site non vérifié.
        run: |
          set -o pipefail
          ./orchestration/verify.sh | tee /tmp/verify.log

      # Un nouveau set de cartes est apparu et le calendrier ne sait pas le dater : les
      # tournois concernés sortent des vues par format en attendant une décision humaine
      # (cf. SPEC § « Comment le format évolue »). Ça NE DOIT PAS bloquer le déploiement —
      # le site reste juste, il lui manque un classement — mais ça ne doit pas non plus
      # rester au fond d'un log que personne n'ouvre. D'où une annotation sur le run et une
      # ligne dans le résumé, visibles sans dérouler quoi que ce soit.
      - name: Signaler un changement de format en cours
        if: always()
        working-directory: optcgsim-deckpacks-library
        run: |
          if grep -q 'NOUVEAU(X) SET(S)' /tmp/verify.log; then
            ligne=$(grep 'NOUVEAU(X) SET(S)' /tmp/verify.log | head -1 | sed 's/^ *⚠ *//')
            echo "::warning title=Changement de format en cours::$ligne"
            {
              echo "### ⚠ Changement de format en cours"
              echo ""
              echo "$ligne"
              echo ""
              echo "À trancher dans \`sitegen/formats.py\` : \`FORMAT_OF_SET\` si ces sets"
              echo "ouvrent un format à décimale, \`LEGAL_SETS_AT_HORIZON\` seul sinon."
              echo "Puis avancer \`CALENDAR_HORIZON\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun set postérieur à l'horizon du calendrier." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: optcgsim-deckpacks-library/dist

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
