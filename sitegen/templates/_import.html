{# Import block — the visually dominant element of every page.
   `pack_url` is a path absolute from the site root (e.g. /tournois/x/deckpack.json). #}
<section class="import-block">
  <h2 class="import-title">Import into OPTCGSim</h2>
  <p class="import-help">Copy the command below and paste it into
    <a href="https://github.com/hquezser/optcgsim-studio" rel="noreferrer nofollow"
      target="_blank">optcgsim-studio</a>.</p>
  <pre class="import-cmd"><code>{{ import_command(base_url, pack_url) }}</code></pre>
</section>
