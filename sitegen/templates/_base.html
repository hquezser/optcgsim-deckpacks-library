<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OPTCGSim deckpacks{% endblock %}</title>
  <link rel="icon" href="{{ rel }}favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ rel }}style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-home" href="{{ rel }}index.html">OPTCGSim deckpacks</a>
    <nav>
      <a href="{{ rel }}index.html">Tournaments</a>
      <a href="{{ rel }}meta/">Meta</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Static site — no network requests. Import packs into
      <a href="https://github.com/hquezser/optcgsim-studio" rel="noreferrer nofollow"
        target="_blank">optcgsim-studio</a>.</p>
  </footer>
</body>
</html>
